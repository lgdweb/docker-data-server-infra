# Fallback stack for a data/web server, usable without Ansible.
#
# `ansibleToolByTuxi` is the source of truth: it deploys the same services with
# `roles/docker/container` and owns the real configuration. This file exists to
# mount a bare server, or to repair one whose Ansible provisioning is not
# available. Do not run it on a host that Ansible already manages: the service
# and container names collide.
#
# The `default-nw` and `reverse-proxy-nw` networks are external, like in the
# Ansible roles: create them first (see README, "External Docker networks").

services:
  fail2ban:
    image: crazymax/fail2ban:1.1.1
    container_name: 'fail2ban-${HOSTNAME}'
    network_mode: 'host'
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - '/srv/fail2ban/data:/data'
      - '/srv/logs:/srv/logs'
      - '/var/log:/var/log:ro'
    restart: unless-stopped
    environment:
      - TZ=Europe/Paris
      # The log file is the source of the `recidive` jail: it reads
      # /srv/logs/fail2ban/fail2ban.log. STDOUT would leave that jail blind.
      - F2B_LOG_TARGET=/srv/logs/fail2ban/fail2ban.log
      - F2B_LOG_LEVEL=INFO
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
      # No F2B_ACTION / F2B_DEST_EMAIL here: the image entrypoint does not read
      # them. `action` and `destemail` live in fail2ban/data/jail.d/default.conf.
      # No SMTP sidecar either: mail leaves through the host MTA on 127.0.0.1:25
      # (exim4, installed by roles/exim/config). The msmtpd sidecar published no
      # port, so this host-network container could never reach it.
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.16.0
    container_name: 'nginx-proxy-manager-${HOSTNAME}'
    environment:
      TZ: 'Europe/Paris'
    ports:
      - '80:80'
      - '443:443'
      # Admin panel on the loopback interface only. Never create a proxy host
      # pointing at port 81: NPM listens on 0.0.0.0:81 inside its container, so
      # that would republish the panel on 80/443. Use an SSH tunnel instead.
      - '127.0.0.1:81:81'
    volumes:
      - /srv/nginx-proxy-manager/data:/data
      - /srv/nginx-proxy-manager/data/letsencrypt:/etc/letsencrypt
      - /srv/logs/nginx-proxy-manager:/data/logs/
    networks:
      - reverse-proxy-nw
      - default-nw
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  main-site:
    image: lgdweb/nginx-test:latest
    container_name: 'main-site-${HOSTNAME}'
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      - reverse-proxy-nw
      - default-nw
    volumes:
      - /srv/logs/nginx:/var/log/nginx
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
  arcane:
    # Container management UI. Replaces Portainer: no agent, no extra port.
    # The manager mounts the local Docker socket, so it manages this host
    # directly; an agent would need an AGENT_TOKEN obtained from the API at
    # runtime, which a static compose file cannot provide.
    image: ghcr.io/getarcaneapp/manager:v2.17.3
    container_name: 'arcane-manager-${HOSTNAME}'
    environment:
      TZ: 'Europe/Paris'
      APP_URL: '${APP_URL:?APP_URL is required}'
      PUID: '1000'
      PGID: '1000'
      # Never change ENCRYPTION_KEY on a manager that already holds data: it is
      # not reconciled and makes the database unreadable.
      ENCRYPTION_KEY: '${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}'
      # Must be `arc_` followed by 64 hex characters, otherwise the manager
      # silently refuses it at startup. Safe to rotate.
      ADMIN_STATIC_API_KEY: '${ADMIN_STATIC_API_KEY:?ADMIN_STATIC_API_KEY is required}'
      # NPM is the only client of the API; without this Arcane logs the proxy IP.
      TRUSTED_PROXIES: '${TRUSTED_PROXIES:-192.168.10.0/26}'
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock'
      - 'arcane-manager-data:/app/data'
    networks:
      - default-nw
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  arcane-manager-data:
    # Fixed name: the volume holds the manager database and must survive a
    # rename of the compose project (manual, Arcane, another directory).
    # Ansible uses `arcane-manager-data-<host>`, so the two never collide.
    name: arcane-manager-data

networks:
  # Both networks are created outside this stack, so other projects can join.
  # `default-nw` must use the 192.168.10.0/26 iprange: it is the value of
  # TRUSTED_PROXIES above.
  default-nw:
    external: true
    name: default-nw
  reverse-proxy-nw:
    external: true
    name: reverse-proxy-nw
