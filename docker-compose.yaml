services:
  msmtpd:
    # Pinned: ':latest' drifted between hosts (mary still ran a 2025 image while
    # the test hosts ran the 2026 one). This sidecar publishes no port and is
    # therefore NOT on the mail path: Fail2ban sends to 127.0.0.1:25, which
    # needs a host MTA (exim4). See `roles/exim/config` in the ansible repo.
    image: crazymax/msmtpd:1.8.34
    container_name: msmtpd
    environment:
      - TZ=Europe/Paris
      - SMTP_HOST=mail.infomaniak.com
      - SMTP_PORT=587
      - SMTP_TLS=on
      - SMTP_STARTTLS=on
      - SMTP_AUTH=on
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_DOMAIN=${HOSTNAME}.lgdweb.ovh
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '2500']
      interval: 10s
      timeout: 5s
      retries: 3

  fail2ban:
    image: crazymax/fail2ban:1.1.1
    container_name: fail2ban
    depends_on:
      msmtpd:
        condition: service_healthy
    network_mode: 'host'
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - '/srv/fail2ban/data:/data'
      - '/srv/logs:/srv/logs'
      - '/var/log:/var/log:ro'
    restart: unless-stopped
    environment:
      - TZ=Europe/Paris
      # The log file is the source of the `recidive` jail: it reads
      # /srv/logs/fail2ban/fail2ban.log. STDOUT would leave that jail blind.
      - F2B_LOG_TARGET=/srv/logs/fail2ban/fail2ban.log
      - F2B_LOG_LEVEL=INFO
      # No F2B_ACTION / F2B_DEST_EMAIL here: the image entrypoint does not read
      # them. `action` and `destemail` live in fail2ban/data/jail.d/default.conf.
  manager:
    image: jc21/nginx-proxy-manager:2.16.0
    container_name: nginx-proxy-manager
    environment:
      TZ: 'Europe/Paris'
    ports:
      - '80:80'
      - '443:443'
      # Admin panel on the loopback interface only. Never create a proxy host
      # pointing at port 81: NPM listens on 0.0.0.0:81 inside its container, so
      # that would republish the panel on 80/443. Use an SSH tunnel instead.
      - '127.0.0.1:81:81'
    volumes:
      - /srv/nginx-proxy-manager/data:/data
      - /srv/nginx-proxy-manager/data/letsencrypt:/etc/letsencrypt
      - /srv/logs/nginx-proxy-manager:/data/logs/
    networks:
      - reverse-proxy-nw
  main:
    image: lgdweb/nginx-test:latest
    container_name: nginx-main
    networks:
      - reverse-proxy-nw
    volumes:
      - /srv/logs/nginx:/var/log/nginx
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
  agent:
    image: portainer/agent:lts
    container_name: portainer-agent
    restart: unless-stopped
    networks:
      - portainer-default
    ports:
      - 9001:9001
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
  server:
    image: portainer/portainer-ce:lts
    container_name: portainer-server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - portainer-default
      - reverse-proxy-nw
    ports:
      - '9443:9443'
      - '9000:9000'
      - '8000:8000'
    volumes:
      - /srv/portainer/data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes

networks:
  portainer-default:
    attachable: true
  reverse-proxy-nw:
    external: true
