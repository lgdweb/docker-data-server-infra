# Fail2Ban action for Docker-published services.
#
# Bans are inserted in two chains, on purpose:
#   - DOCKER-USER is traversed after Docker DNAT and before Docker's own
#     ACCEPT rules, so a ban really cuts published container ports, and Docker
#     preserves its content across `systemctl restart docker`;
#   - INPUT is required for IPv6. Published ports are also served on [::] by
#     docker-proxy in userspace (the container network has no IPv6 DNAT), so
#     v6 traffic never reaches DOCKER-USER and would otherwise not be bannable
#     at all for these jails. The stock action handles ip6tables through its
#     [Init?family=inet6] section.
#
# Consequence to keep in mind: the jails set `port = 0:65535`, so the INPUT
# jump matches every TCP port. A ban from these jails therefore also blocks
# SSH from the offending IP, both families. Before this change only recidive
# did that.
#
# Command logic (actionstart/stop/check/ban/unban, -C guards, comma-split of
# `chain`, ip6tables handling) comes from the stock iptables.conf. This file
# only pins parameters, so nothing has to be duplicated or maintained.

[INCLUDES]

before = iptables.conf

[Definition]

type = multiport

[Init]

chain = DOCKER-USER,INPUT
blocktype = DROP
