# Fail2Ban action for Docker-published services.
#
# Bans are inserted in the DOCKER-USER chain instead of FORWARD:
#   - DOCKER-USER is traversed after Docker DNAT and before Docker's own
#     ACCEPT rules, so a ban really cuts published container ports;
#   - host services are left alone: sshd and recidive keep banning in INPUT;
#   - the chain survives `systemctl restart docker` (Docker preserves user
#     rules there), unlike rules inserted directly in FORWARD.
#
# Command logic (actionstart/stop/check/ban/unban, -C guards, ip6tables
# handling) comes from the stock iptables.conf. This file only pins the
# parameters, so nothing has to be duplicated or maintained.

[INCLUDES]

before = iptables.conf

[Definition]

type = multiport

[Init]

chain = DOCKER-USER
blocktype = DROP
