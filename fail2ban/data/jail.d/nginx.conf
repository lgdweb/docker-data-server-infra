# Both jails ban in DOCKER-USER (see action.d/iptables-docker.conf).
# port = 0:65535 keeps the coverage these jails had with the old custom action
# (all published container ports, not only 80/443).

[nginx-http-auth]

enabled   = true
filter    = nginx-http-auth
port      = 0:65535
logpath   = /srv/logs/nginx/error.log
banaction = iptables-docker
maxretry  = 2
action    = %(action_mwl)s

[nginx-badbots]

enabled   = true
port      = 0:65535
filter    = badbots
logpath   = /srv/logs/nginx/access.log
maxretry  = 2
banaction = iptables-docker
action    = %(action_mwl)s
