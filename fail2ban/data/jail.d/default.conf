[DEFAULT]

# actionstart/actionstop are NOT defined here on purpose. With a multi-action
# string (action = %(action_mwl)s), these jail-level parameters are ignored:
# each action file carries its own actionstart/actionstop. The start/stop
# notification mails come from action.d/sendmail-common.conf, so they are
# always on. Setting them empty here (commit b554e2b) never disabled anything.
maxretry          = 10
findtime          = 1d
bantime           = 15m
bantime.increment = true
bantime.overalljails = true
dbpurgeage        = 691200 # 8d
destemail         = server+notif@lgdweb.fr
sender            = server+$(hostname -s)@lgdweb.fr
# Admin access only, no host IPs: servers banning each other is the normal
# case and must stay testable. 192.168.0.0/24 is the home LAN (workstation
# .10/.101, homelab .20); 192.168.10.1/24 was removed because it is the Docker
# bridge (br-* on every host), not a LAN. 192.168.100.0/24 is deliberately
# absent: it is the test LAN, and the fail2ban harness needs 192.168.100.1 to
# remain bannable.
ignoreip          = 127.0.0.1/8 192.168.0.0/24 lgdweb.duckdns.org
