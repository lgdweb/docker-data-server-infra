[proxy]

enabled   = true
logpath   = /srv/logs/nginx-proxy-manager/fallback_*.log
            /srv/logs/nginx-proxy-manager/proxy-host-*.log
maxretry  = 4
filter    = proxy
# Bans target DOCKER-USER (see action.d/iptables-docker.conf). port is set
# explicitly so a future change to fail2ban's [DEFAULT] cannot silently narrow
# the ban to a single port.
banaction = iptables-docker
port      = 0:65535
action    = %(action_mwl)s
